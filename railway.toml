[build]
builder = "RAILPACK"
buildCommand = "composer install --no-interaction --prefer-dist --optimize-autoloader && npm ci && npm run production"

[deploy]
startCommand = "php -d variables_order=EGPCS artisan serve --host=0.0.0.0 --port=${PORT}"
preDeployCommand = "php artisan migrate --force"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/"
healthcheckTimeout = 300
